[project]
name = "judgebench-code"
version = "0.1.0"
description = "A benchmark and bias suite for code autoraters (LLM judges of PRs)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "anthropic>=0.40",
  "openai>=1.50",
  "pandas>=2.1",
  "statsmodels>=0.14",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jbc = "jbc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jbc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]  # typer.Option in defaults is the typer idiom
