# price_in / price_out: USD per 1M tokens (OpenAI / Anthropic standard list prices, Oct 2026).
# Judges whose `model` resolves to "" are skipped (e.g. no Anthropic key configured).
judges:
  - id: heuristic-tests
    kind: heuristic
  - {id: merge-zs-gpt6.1-sol, kind: zero_shot, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0}
  - {id: rubric-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0}
  - {id: rubricblind-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, rubric: rubric_blind.yaml, bias_warning: false}
  - {id: merge-zs-gpt6-luna, kind: zero_shot, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50}
  - {id: rubric-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50}
  - {id: merge-zs-sonnet5, kind: zero_shot, provider: anthropic, model: claude-sonnet-5, price_in: 2.0, price_out: 10.0}
  - {id: rubric-sonnet5, kind: rubric, provider: anthropic, model: claude-sonnet-5, price_in: 2.0, price_out: 10.0}
  - {id: merge-zs-haiku4.5, kind: zero_shot, provider: anthropic, model: claude-haiku-4-5-20251001, price_in: 1.0, price_out: 5.0}
  - {id: rubric-haiku4.5, kind: rubric, provider: anthropic, model: claude-haiku-4-5-20251001, price_in: 1.0, price_out: 5.0}
  - {id: rubricx-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, verify: true}
  - {id: rubricx-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, verify: true}
  - {id: rubricblind-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, rubric: rubric_blind.yaml, bias_warning: false}
  - {id: merge-zs-neutral-gpt6.1-sol, kind: zero_shot, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, bias_warning: false}
  - {id: merge-zs-neutral-gpt6-luna, kind: zero_shot, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, bias_warning: false}
  # Channel ablation (pre-registration v5): what the judge is allowed to see.
  - {id: rubric-code-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, channels: ""}
  - {id: rubric-codetests-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, channels: "tests"}
  - {id: rubric-codedesc-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, channels: "desc"}
  - {id: rubric-code-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, channels: ""}
  - {id: rubric-codetests-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, channels: "tests"}
  - {id: rubric-codedesc-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, channels: "desc"}
  # Execution check + cross-candidate consensus (pre-registration v5).
  - {id: rubricxc-gpt6.1-sol, kind: rubric, provider: openai, model: gpt-6.1-sol, price_in: 2.0, price_out: 10.0, verify: true, consensus: true}
  - {id: rubricxc-gpt6-luna, kind: rubric, provider: openai, model: gpt-6-luna, price_in: 0.10, price_out: 0.50, verify: true, consensus: true}
